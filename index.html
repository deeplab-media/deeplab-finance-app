<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Deeplab Finance — Bảng điều khiển tài chính dự án</title>
<meta name="theme-color" content="#15171B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deeplab Finance">
<link rel="apple-touch-icon" href="finance-icon-180.png">
<link rel="icon" type="image/png" href="finance-icon.png">
<link rel="manifest" href="app.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#15171B;
  --panel:#1E2126;
  --panel-2:#252930;
  --line:#31363E;
  --line-soft:#2A2E35;
  --text:#E9EBEE;
  --muted:#8B929C;
  --dim:#5F666F;
  --teal:#3AC5A2;
  --amber:#E4A63C;
  --clay:#D4705B;
  --plum:#8E86DE;
  --red:#E1574F;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{overflow-x:clip}
body{
  background:var(--void);
  color:var(--text);
  font-family:'Be Vietnam Pro',system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--teal)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.rail{
  width:212px;flex:0 0 212px;background:var(--panel);border-right:1px solid var(--line-soft);
  padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;
}
.brand{padding:0 8px 22px;display:flex;align-items:center;gap:10px}
.brand-logo{width:30px;height:30px;flex:0 0 30px;object-fit:contain}
.mwrap{flex:1;min-width:0}
.mtop{display:none}
.nico,.nshort{display:none}
.brand-mark{
  width:26px;height:26px;border-radius:7px;flex:0 0 26px;
  background:linear-gradient(145deg,var(--teal),#2a7d9e);
  display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#0d1114;
}
.brand-name{font-weight:600;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:10px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.navbtn{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  color:var(--muted);font-weight:500;text-align:left;width:100%;transition:.14s;
}
.navbtn:hover{background:var(--panel-2);color:var(--text)}
.navbtn.on{background:var(--panel-2);color:var(--text)}
.navbtn.on .navdot{background:var(--teal)}
.navdot{width:5px;height:5px;border-radius:50%;background:var(--dim);flex:0 0 5px}
.rail-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line-soft);font-size:11px;color:var(--dim)}

.main{flex:1;min-width:0;padding:26px 30px 80px;max-width:1180px}
.page-head{margin-bottom:22px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.page-desc{color:var(--muted);margin-top:4px;max-width:640px}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px 18px}
.card-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-bottom:12px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px 16px;position:relative}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--dim);border-radius:var(--r) 0 0 var(--r)}
.kpi.teal::before{background:var(--teal)}
.kpi.amber::before{background:var(--amber)}
.kpi.clay::before{background:var(--clay)}
.kpi.plum::before{background:var(--plum)}
.kpi.red::before{background:var(--red)}
.kpi-label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.kpi-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.kpi-sub{font-size:11px;color:var(--dim);margin-top:4px}
.pos{color:var(--teal)} .neg{color:var(--red)} .hold{color:var(--amber)}

.hint{
  display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;
  border:1px solid var(--line);color:var(--dim);font-size:9px;font-family:'JetBrains Mono',monospace;
  cursor:help;position:relative;flex:0 0 14px;
}
.hint:hover{border-color:var(--teal);color:var(--teal)}
.hint::after{
  content:attr(data-tip);position:absolute;bottom:150%;left:50%;transform:translateX(-50%);
  width:250px;background:#0E1013;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  font-family:'Be Vietnam Pro',sans-serif;font-size:12px;line-height:1.45;color:var(--text);
  opacity:0;visibility:hidden;transition:.15s;z-index:60;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.hint:hover::after,.hint.open::after{opacity:1;visibility:visible}

label.f{display:block;margin-bottom:14px}
.f-label{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:5px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--void);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;outline:none;transition:.14s;
}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(58,197,162,.12)}
input.money{font-family:'JetBrains Mono',monospace;text-align:right;font-weight:500}
textarea{resize:vertical;min-height:64px}
input[type=range]{accent-color:var(--teal);background:none!important;border:none!important;padding:0!important;box-shadow:none!important;height:22px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}

.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:500;transition:.14s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--dim);background:#2C313A}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#0C1512;font-weight:600}
.btn-primary:hover{background:#48D6B2;border-color:#48D6B2}
.btn-ghost{background:none;border:1px dashed var(--line);color:var(--muted)}
.btn-ghost:hover{color:var(--text);border-color:var(--dim)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-danger:hover{border-color:var(--red);color:var(--red)}

.due-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle;flex:0 0 7px}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace}
.chip.on{border-color:var(--teal);color:var(--teal);background:rgba(58,197,162,.08)}
.chip.warn{border-color:var(--amber);color:var(--amber);background:rgba(228,166,60,.08)}
.chip.bad{border-color:var(--red);color:var(--red);background:rgba(225,87,79,.08)}

table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-family:'JetBrains Mono',monospace;text-align:left;padding:0 8px 9px;font-weight:500}
td{padding:10px 8px;border-top:1px solid var(--line-soft);vertical-align:middle}
th.r,td.r{text-align:right}
tr.clickable:hover{background:var(--panel-2);cursor:pointer}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:38px 20px;text-align:center;color:var(--muted)}
.empty h3{font-size:15px;color:var(--text);margin-bottom:6px;font-weight:600}

/* ---------- waterfall ---------- */
.wf{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line-soft);background:var(--void)}
.wf-seg{display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#101317;transition:.3s;overflow:hidden;white-space:nowrap}
.wf-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px}
.wf-item{display:flex;align-items:center;gap:7px;font-size:12px}
.wf-key{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.wf-amt{font-family:'JetBrains Mono',monospace;color:var(--muted);margin-left:auto}

.ladder{display:flex;flex-direction:column}
.ladder-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line-soft);gap:12px}
.ladder-row:last-child{border-bottom:none}
.ladder-row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
.ladder-name{display:flex;align-items:center;gap:6px;color:var(--muted)}
.ladder-row.total .ladder-name{color:var(--text);font-weight:600}
.ladder-val{font-family:'JetBrains Mono',monospace;font-weight:500;white-space:nowrap}
.ladder-row.total .ladder-val{font-size:17px;font-weight:700}

.bar-track{height:6px;background:var(--void);border-radius:4px;overflow:hidden;flex:1;min-width:60px}
.bar-fill{height:100%;border-radius:4px;transition:width .3s}

.alert{display:flex;gap:11px;padding:11px 13px;border-radius:9px;border:1px solid;margin-bottom:8px;align-items:flex-start}
.alert-red{border-color:rgba(225,87,79,.4);background:rgba(225,87,79,.07)}
.alert-amber{border-color:rgba(228,166,60,.35);background:rgba(228,166,60,.06)}
.alert-teal{border-color:rgba(58,197,162,.3);background:rgba(58,197,162,.05)}
.alert-icon{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;flex:0 0 auto;margin-top:1px}
.alert b{font-weight:600}
.alert p{font-size:12.5px;color:var(--muted);margin-top:2px}

.costrow{display:grid;grid-template-columns:minmax(110px,1.3fr) minmax(96px,110px) minmax(86px,120px) minmax(86px,120px) 72px 28px;gap:6px;align-items:center;margin-bottom:7px}
.costrow input,.costrow select{padding:7px 9px;font-size:13px}
.costhead{display:grid;grid-template-columns:minmax(110px,1.3fr) minmax(96px,110px) minmax(86px,120px) minmax(86px,120px) 72px 28px;gap:6px;padding:0 0 6px;white-space:nowrap}
.costhead span{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-family:'JetBrains Mono',monospace}
.costhead span.r{text-align:right}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);color:var(--dim);display:grid;place-items:center;font-size:15px;transition:.14s}
.icon-btn:hover{border-color:var(--red);color:var(--red)}
.quickadd{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quickadd button{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px dashed var(--line);color:var(--muted)}
.quickadd button:hover{border-color:var(--teal);color:var(--teal);border-style:solid}

.tog{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.tog input{display:none}
.tog-box{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:transparent;transition:.14s}
.tog input:checked + .tog-box{background:var(--teal);border-color:var(--teal);color:#0C1512}

.split{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.sticky-side{position:sticky;top:26px}
.back{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
.back:hover{color:var(--text)}

.dict dt{font-weight:600;margin-top:16px;display:flex;align-items:center;gap:8px}
.dict dd{color:var(--muted);font-size:13px;margin-top:3px}
.dict code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--void);border:1px solid var(--line-soft);padding:1px 6px;border-radius:5px;color:var(--teal)}

/* ---------- phân cấp thông tin ---------- */
.hero{background:linear-gradient(135deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:12px;position:relative;overflow:visible}
.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:14px 0 0 14px;background:var(--teal)}
.hero.bad::before{background:var(--red)}
.hero-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hero-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:34px;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.hero-sub{font-size:12px;color:var(--dim);margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;margin-bottom:12px}
.stat{background:var(--panel);padding:11px 14px;min-width:0}
.stat-l{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
details.sec{border:1px solid var(--line-soft);border-radius:12px;background:var(--panel);margin-bottom:12px}
details.sec>summary{cursor:pointer;list-style:none;padding:13px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:space-between;gap:8px;user-select:none;transition:.14s}
details.sec>summary:hover{color:var(--muted)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'▸';font-family:'Be Vietnam Pro',sans-serif;transition:.15s;flex:0 0 auto}
details.sec[open]>summary::after{transform:rotate(90deg)}
details.sec>.sec-body{padding:2px 16px 16px}
details.sec .card{border:none;padding:0;background:none}
.sec-hint{font-size:10px;letter-spacing:0;text-transform:none;color:var(--dim);font-family:'Be Vietnam Pro',sans-serif;font-weight:400;margin-left:auto}
.alert-more{margin-bottom:10px}
.alert-more summary{cursor:pointer;font-size:12px;color:var(--muted);padding:8px 12px;border:1px dashed var(--line);border-radius:9px;list-style:none;user-select:none;transition:.14s}
.alert-more summary::-webkit-details-marker{display:none}
.alert-more summary::before{content:'▸ '}
.alert-more[open] summary::before{content:'▾ '}
.alert-more summary:hover{color:var(--text);border-color:var(--muted)}
.alert-more[open] summary{margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel-2);border:1px solid var(--line);padding:10px 18px;border-radius:10px;transition:.25s;opacity:0;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:1020px){
  body{font-size:13px}
  .shell{flex-direction:column;min-height:100dvh}
  /* ---- header nhỏ trên cùng ---- */
  .mtop{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:60;background:rgba(30,33,38,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);padding:calc(7px + env(safe-area-inset-top,0px)) 13px 7px}
  .mtop img{width:21px;height:21px;object-fit:contain}
  .mtop-name{font-weight:600;font-size:13px;letter-spacing:-.01em}
  .mtop-name span{color:var(--muted);font-weight:500}
  .mtop .syncdot{margin-left:auto;font-size:10.5px;color:var(--dim);white-space:nowrap}
  /* ---- rail thành thanh tab dưới đáy như app iOS ---- */
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex:none;flex-direction:row;align-items:stretch;justify-content:space-around;gap:0;padding:5px 2px calc(4px + env(safe-area-inset-bottom,0px));background:rgba(30,33,38,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-right:none;z-index:70}
  .brand{display:none}
  .rail-foot{display:none}
  .navdot{display:none}
  .nfull{display:none}
  .nico{display:block;font-size:18px;line-height:1;filter:grayscale(1) opacity(.55);transition:.16s}
  .nshort{display:block;font-size:9px;line-height:1.1;transition:.16s}
  .navbtn{flex:1;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 2px;border-radius:10px;position:relative;color:var(--dim)}
  .navbtn:hover{background:none}
  .navbtn.on{background:rgba(58,197,162,.11);color:var(--teal)}
  .navbtn.on .nico{filter:none;transform:translateY(-1px)}
  .navbtn.on .nshort{font-weight:600}
  /* ---- nội dung: thoáng, có nhịp nghỉ giữa các khối ---- */
  .main{padding:16px 14px calc(80px + env(safe-area-inset-bottom,0px));max-width:none}
  .page-head{margin-bottom:16px}
  .page-title{font-size:19px}
  .page-desc{font-size:12px;margin-top:3px}
  .card{padding:14px}
  .card-title{font-size:10px;margin-bottom:10px}
  .grid{gap:9px}
  .stack{gap:12px}
  .kpi{padding:11px 13px;border-radius:12px}
  .kpi-label{font-size:10.5px}
  .kpi-val{font-size:17px;margin-top:5px}
  .kpi-sub{font-size:10px;margin-top:3px}
  .g4,.g3{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:1fr}
  .sticky-side{position:static}
  .row{flex-wrap:wrap}
  label.f{margin-bottom:9px}
  .f-label{font-size:10px;margin-bottom:3px}
  /* ô nhập nhỏ gọn — maximum-scale=1 ở viewport đã chặn iOS tự zoom */
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{font-size:13px;padding:7px 9px;border-radius:7px}
  .btn{padding:7px 11px;font-size:12.5px}
  .btn-sm{padding:6px 9px;font-size:12px}
  /* ---- HERO: khối chính, có màu nền theo trạng thái ---- */
  .hero{padding:18px 17px;border-radius:16px;margin-bottom:14px;
    background:linear-gradient(140deg,rgba(58,197,162,.16) 0%,var(--panel-2) 55%);border-color:rgba(58,197,162,.3)}
  .hero.bad{background:linear-gradient(140deg,rgba(225,87,79,.18) 0%,var(--panel-2) 55%);border-color:rgba(225,87,79,.34)}
  .hero::before{width:0}
  .hero-label{font-size:10.5px;letter-spacing:.09em;font-family:'JetBrains Mono',monospace}
  .hero-val{font-size:30px;margin-top:8px}
  .hero-sub{font-size:11px;margin-top:8px;line-height:1.5}
  /* ---- dải chỉ số phụ: mỗi ô một sắc riêng ---- */
  .stats{border-radius:14px;gap:1px;margin-bottom:14px}
  .stat{padding:11px 12px;position:relative}
  .stat::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--dim)}
  .stat:nth-child(1)::before{background:var(--amber)}
  .stat:nth-child(2)::before{background:var(--clay)}
  .stat:nth-child(3)::before{background:var(--plum)}
  .stat-l{font-size:10px}
  .stat-v{font-size:14.5px;margin-top:5px}
  /* ---- mục thu gọn: viền rõ hơn, chạm dễ hơn ---- */
  details.sec{border-radius:14px;margin-bottom:11px}
  details.sec>summary{padding:14px;font-size:10.5px}
  details.sec[open]>summary{border-bottom:1px solid var(--line-soft)}
  details.sec>.sec-body{padding:14px}
  .sec-hint{font-size:9.5px}
  /* page-head: nút xếp xuống dưới tiêu đề thay vì chen ngang */
  .page-head .spread{flex-direction:column;align-items:flex-start;gap:10px}
  .chip{white-space:nowrap}
  /* bớt chữ: ẩn các dòng diễn giải dài, chỉ giữ số và nhãn */
  .m-hide{display:none}
  .kpi-sub{display:none}

  /* bảng dự án: giấu cột phụ (khách, trạng thái, biên gộp, cần giữ lại) cho hết trượt ngang */

<script>
/* ============ CONSTANTS ============ */
const KEY='deeplab-finance-v1';
const CAT=['Nhân sự','Thiết bị','Bối cảnh','Hậu kỳ','Đi lại & ăn ở','Đạo cụ','Bản quyền','Khác'];
const QUICK=[
  ['Đạo diễn / DOP','Nhân sự'],['Quay phim','Nhân sự'],['Trợ lý sản xuất','Nhân sự'],
  ['Diễn viên / mẫu','Nhân sự'],['Dựng phim','Hậu kỳ'],['Colorist','Hậu kỳ'],['Motion / VFX','Hậu kỳ'],
  ['Thuê máy + ống kính','Thiết bị'],['Ánh sáng','Thiết bị'],['Thuê bối cảnh','Bối cảnh'],
  ['Đi lại','Đi lại & ăn ở'],['Ăn uống đoàn','Đi lại & ăn ở'],['Đạo cụ','Đạo cụ'],['Nhạc bản quyền','Bản quyền']
];
const DEF={
  settings:{
    vat:8, cit:20, pit:10, workDays:22, allocMethod:'days',
    overheadPct:12, targetGM:45, ownerSalary:25000000,
    reservePct:8, reserveBalance:0, reserveMonths:3, avgRevenue:80000000,
    citExempt:false, citUntil:'', pitThreshold:5000000,
    jarTax:12, jarOps:23, jarReserve:8,
    overhead:[
      {id:u(),name:'Thuê văn phòng + điện nước + wifi',amount:10000000,inv:true},
      {id:u(),name:'Kế toán thuê ngoài',amount:1000000,inv:true},
      {id:u(),name:'Bộ công cụ AI (Claude, GPT, Gemini)',amount:2800000,inv:false},
      {id:u(),name:'Hosting / server',amount:400000,inv:false},
      {id:u(),name:'Tên miền, phần mềm khác',amount:300000,inv:false},
      {id:u(),name:'Khấu hao thiết bị quay dựng',amount:4000000,inv:false},
      {id:u(),name:'Dự phòng (sửa máy, tiếp khách, phát sinh)',amount:2000000,inv:false}
    ]
  },
  projects:[],
  product:{infraMonthly:700000,licensePrice:349000,tools:[],revenue:[],goal:{target:30000000,leadTrial:6,trialBuy:18,leadsNow:170}}
};
function normProduct(p){
  const b=JSON.parse(JSON.stringify(DEF.product));
  const o=Object.assign(b,p||{});
  o.tools=o.tools||[];o.revenue=o.revenue||[];
  o.goal=Object.assign({target:30000000,leadTrial:6,trialBuy:18,leadsNow:170},o.goal||{});
  return o;
}

/* ============ STATE ============ */
let S=JSON.parse(JSON.stringify(DEF));
let tab='dash', openId=null, quote={cost:0,days:3,gm:45}, jar={amount:0,project:''};

function u(){return Math.random().toString(36).slice(2,9)}
function n(v){v=parseFloat(v);return isFinite(v)?v:0}
const nf=new Intl.NumberFormat('vi-VN');
function f(v){return nf.format(Math.round(n(v)))}
function fs(v){ // dạng ngắn
  v=n(v);const a=Math.abs(v),s=v<0?'-':'';
  if(a>=1e9)return s+(a/1e9).toFixed(a>=1e10?1:2).replace('.',',')+' tỷ';
  if(a>=1e6)return s+(a/1e6).toFixed(a>=1e8?0:1).replace('.',',')+' tr';
  if(a>=1e3)return s+Math.round(a/1e3)+'k';
  return s+Math.round(a);
}
function pc(v){return (n(v)*100).toFixed(1).replace('.',',')+'%'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4500)}

/* ============ STORAGE ============ */
const hasHost = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
let localOK=false;
if(!hasHost){ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); localOK=true }catch(e){ localOK=false } }

async function readRaw(){
  if(hasHost){ const r=await window.storage.get(KEY); return r&&r.value }
  if(localOK) return localStorage.getItem(KEY);
  return null;
}
async function writeRaw(v){
  if(hasHost) return window.storage.set(KEY,v);
  if(localOK) return localStorage.setItem(KEY,v);
  throw new Error('no storage');
}
async function load(){
  try{
    const v=await readRaw();
    if(v){const d=JSON.parse(v);S={settings:Object.assign({},DEF.settings,d.settings||{}),projects:d.projects||[],product:normProduct(d.product),updatedAt:d.updatedAt||0}}
  }catch(e){/* chưa có dữ liệu — dùng mặc định */}
}
let saveT=null, warned=false;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    S.updatedAt=Date.now();
    S.cleared=!(S.projects&&S.projects.length); // đánh dấu "trống chủ đích" để máy khác chấp nhận xoá
    try{ await writeRaw(JSON.stringify(S)) }
    catch(e){ if(!warned){warned=true;toast('Trình duyệt này không cho lưu. Hãy bấm Sao lưu JSON trước khi đóng.')} }
    ghSchedule();
  },400);
}

/* ============ ĐỒNG BỘ GITHUB ============ */
/* Dữ liệu đẩy lên repo PRIVATE deeplab-finance-data dưới dạng data.json + bao-cao.md.
   Token là fine-grained PAT chỉ có quyền Contents trên đúng repo đó, lưu trong localStorage của từng máy. */
const GHD={owner:'deeplab-media',repo:'deeplab-finance-data',branch:'main'};
let ghShaData=null, ghShaRep=null, ghTimer=null, ghBusy=false, ghLast=0, ghState='off';
function ghTok(){try{return localStorage.getItem('dlf-gh-token')||''}catch(e){return ''}}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\n/g,''))))}
function ghSetState(st){
  ghState=st;
  const map={off:['—','var(--dim)','Chưa bật đồng bộ'],idle:['●','var(--dim)','Đã kết nối'],pending:['●','var(--amber)','Đang đồng bộ…'],ok:['●','var(--teal)','Đã đồng bộ'],error:['●','var(--red)','Lỗi đồng bộ']};
  const m=map[st]||map.off;
  document.querySelectorAll('.syncdot').forEach(el=>{
    el.innerHTML='<span style="color:'+m[1]+'">'+m[0]+'</span> '+m[2]+(st==='ok'&&ghLast?' '+new Date(ghLast).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'');
  });
  if(tab==='settings'){const st2=document.getElementById('ghstatus');if(st2)st2.textContent=({off:'Chưa kết nối',idle:'Đã kết nối, chưa đồng bộ lần nào',pending:'Đang đồng bộ…',ok:'Đồng bộ lần cuối: '+(ghLast?new Date(ghLast).toLocaleString('vi-VN'):''),error:'Lỗi — kiểm tra mạng hoặc token'})[st]||''}
}
async function ghReq(method,path,body){
  const r=await fetch('https://api.github.com/repos/'+GHD.owner+'/'+GHD.repo+(path?'/'+path:''),{
    method:method,
    headers:{'Authorization':'Bearer '+ghTok(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined
  });
  return r;
}
async function ghPull(){
  const r=await ghReq('GET','contents/data.json?ref='+GHD.branch+'&t='+Date.now());
  if(r.status===404){ghShaData=null;return null}
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();
  ghShaData=j.sha;
  try{return JSON.parse(b64d(j.content))}catch(e){return null}
}
function ghAdopt(d){
  S={settings:Object.assign({},DEF.settings,d.settings||{}),projects:d.projects||[],product:normProduct(d.product),updatedAt:d.updatedAt||0};
  writeRaw(JSON.stringify(S)).catch(()=>{});
  render();
}
async function ghPushFile(path,content,sha){
  const body={message:'Deeplab Finance sync '+new Date().toISOString(),content:b64e(content),branch:GHD.branch};
  if(sha)body.sha=sha;
  const r=await ghReq('PUT','contents/'+path,body);
  if(!r.ok)throw Object.assign(new Error('GitHub '+r.status),{status:r.status});
  const j=await r.json();
  return j.content&&j.content.sha;
}
async function ghPushAll(){
  ghShaData=await ghPushFile('data.json',JSON.stringify(S,null,1),ghShaData);
  try{
    if(ghShaRep===null){const r0=await ghReq('GET','contents/bao-cao.md?ref='+GHD.branch);if(r0.ok){const j0=await r0.json();ghShaRep=j0.sha}}
    ghShaRep=await ghPushFile('bao-cao.md',aiReport(),ghShaRep);
  }catch(e){/* báo cáo lỗi không chặn đồng bộ dữ liệu */}
}
async function ghSync(pullOnly){
  if(!ghTok()||ghBusy)return;
  ghBusy=true;ghSetState('pending');
  try{
    const remote=await ghPull();
    const localN=(S.projects||[]).length;
    const remoteN=remote?(remote.projects||[]).length:0;
    // "established" = máy này đã từng đồng bộ thành công — máy lạ/trống không bao giờ được đè kho
    const established=(()=>{try{return localStorage.getItem('dlf-synced')==='1'}catch(e){return false}})();
    if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){
      if(remoteN===0&&localN>0&&!remote.cleared){
        // kho bị trống KHÔNG chủ đích (sự cố) nhưng máy này còn dữ liệu → đẩy lên lại, không cho xoá
        S.updatedAt=Date.now();
        await ghPushAll();
        toast('Kho đang trống — đã đẩy lại dữ liệu từ máy này lên');
      }else{
        ghAdopt(remote);
        toast('Đã lấy dữ liệu mới hơn từ máy khác');
      }
    }else if(!pullOnly&&(S.updatedAt||0)>((remote&&remote.updatedAt)||0)){
      if(localN===0&&remoteN>0&&!established){
        // máy mới kết nối, chưa có gì → tải dữ liệu về thay vì đè kho
        ghAdopt(remote);
        toast('Đã tải dữ liệu từ kho về máy này');
      }else{
        await ghPushAll();
      }
    }
    try{localStorage.setItem('dlf-synced','1')}catch(e){}
    ghLast=Date.now();ghSetState('ok');
  }catch(e){
    if(e&&(e.status===409||e.status===422)){ghShaData=null;ghShaRep=null;ghSetState('idle');ghSchedule();}
    else ghSetState('error');
  }
  ghBusy=false;
}
function ghSchedule(){
  if(!ghTok())return;
  clearTimeout(ghTimer);
  ghTimer=setTimeout(()=>ghSync(false),2500);
}
async function ghConnect(){
  const inp=document.getElementById('ghtoken');
  const t=(inp&&inp.value||'').trim();
  if(!t){toast('Dán token vào ô trước đã');return}
  try{localStorage.setItem('dlf-gh-token',t)}catch(e){toast('Trình duyệt không cho lưu token');return}
  ghShaData=null;ghShaRep=null;
  let r;
  try{r=await ghReq('GET','')}
  catch(e){
    try{localStorage.removeItem('dlf-gh-token')}catch(e2){}
    toast('Lỗi kết nối GitHub: '+((e&&e.message)?e.message:e));
    ghSetState('off');return;
  }
  if(!r.ok){
    try{localStorage.removeItem('dlf-gh-token')}catch(e){}
    toast(r.status===404?'Token không có quyền vào repo '+GHD.repo:'Token không hợp lệ ('+r.status+')');
    ghSetState('off');return;
  }
  toast('Kết nối thành công — đang đồng bộ…');
  await ghSync(false);
  if(tab==='settings')render();
}
function ghDisconnect(){
  try{localStorage.removeItem('dlf-gh-token')}catch(e){}
  ghShaData=null;ghShaRep=null;ghSetState('off');
  toast('Đã ngắt đồng bộ trên máy này');
  if(tab==='settings')render();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ghTok())ghSync(true)});

/* ============ TÍNH TOÁN ============ */
function ohMonthly(){return S.settings.overhead.reduce((a,b)=>a+n(b.amount),0)+n(S.settings.ownerSalary)}
function ohDeductibleRatio(){
  const t=S.settings.overhead.reduce((a,b)=>a+n(b.amount),0)+n(S.settings.ownerSalary);
  if(t<=0)return 0;
  const d=S.settings.overhead.filter(o=>o.inv).reduce((a,b)=>a+n(b.amount),0);
  return d/t; // lương chủ mặc định coi là không có chứng từ hợp lệ
}
function ohPerDay(){return ohMonthly()/Math.max(1,n(S.settings.workDays))}

function calc(p){
  const v=n(S.settings.vat)/100, cit=n(S.settings.cit)/100, pit=n(S.settings.pit)/100;
  const gross=n(p.contract);
  const netRev=p.vatIncluded? gross/(1+v) : gross;
  const vatOut=netRev*v;
  const billed=netRev+vatOut;

  let dGross=0,dNet=0,vatIn=0,deduct=0,planned=0,people=0;
  (p.costs||[]).forEach(c=>{
    const act=(c.actual===''||c.actual==null)? n(c.planned) : n(c.actual);
    const net=c.inv? act/(1+v) : act;
    dGross+=act; dNet+=net; planned+=n(c.planned);
    if(c.inv){vatIn+=act-net; deduct+=net}
    if(!c.inv&&act>=n(S.settings.pitThreshold)) people+=act;
  });

  const gp=netRev-dNet;
  const gm=netRev>0? gp/netRev : 0;

  const oh = S.settings.allocMethod==='days'
    ? ohPerDay()*n(p.days)
    : netRev*n(S.settings.overheadPct)/100;

  const ebt=gp-oh;
  const taxable=netRev-deduct-oh*ohDeductibleRatio();
  const today=new Date().toISOString().slice(0,10);
  const citFree=!!S.settings.citExempt && (!S.settings.citUntil || (p.date||today)<=S.settings.citUntil);
  const citAmt=citFree? 0 : Math.max(0,taxable*cit);
  const net=ebt-citAmt;
  const nm=netRev>0? net/netRev : 0;
  const invested=dNet+oh;
  const roi=invested>0? net/invested : 0;
  const markup=dNet>0? gp/dNet : 0;
  const vatPay=vatOut-vatIn;
  const pitHold=people*pit;

  const collected=(p.payments||[]).filter(x=>x.got).reduce((a,b)=>a+n(b.amount),0);
  const receivable=billed-collected;
  const locked=Math.max(0,vatPay)+citAmt;
  const cash=collected-dGross-locked;
  const noInvRatio=dGross>0? (dGross-(p.costs||[]).filter(c=>c.inv).reduce((a,b)=>a+((b.actual===''||b.actual==null)?n(b.planned):n(b.actual)),0))/dGross : 0;
  const overrun=planned>0? (dGross-planned)/planned : 0;

  return {citFree,gross,netRev,vatOut,billed,dGross,dNet,vatIn,deduct,gp,gm,oh,ebt,taxable,citAmt,net,nm,roi,markup,
          vatPay,pitHold,collected,receivable,locked,cash,noInvRatio,overrun,planned,invested};
}
function actives(){return S.projects.filter(p=>p.status!=='quote')}

/* ============ BÁO CÁO CHO AI ============ */
function aiReport(){
  const s=S.settings, today=new Date().toISOString().slice(0,10);
  const st={running:'Đang chạy',done:'Đã xong',quote:'Báo giá'};
  const pct=v=>(v*100).toFixed(1)+'%';
  const L=[];
  L.push('# Báo cáo tài chính Deeplab Media — cập nhật '+new Date().toLocaleString('vi-VN'));
  L.push('');
  L.push('Số liệu xuất tự động từ app Deeplab Finance (đơn vị: VND). Bạn (AI) hãy đóng vai CFO: đọc số liệu, chỉ ra rủi ro dòng tiền, dự án đang rò rỉ lợi nhuận ở đâu, và 3 việc cần làm ngay. Bối cảnh: công ty một người (agency sản xuất video tại VN), chủ doanh nghiệp không có nền tảng tài chính — giải thích bằng ngôn ngữ đời thường.');
  L.push('');
  L.push('## Bộ máy cố định hàng tháng');
  s.overhead.forEach(o=>L.push('- '+o.name+': '+f(o.amount)+' ('+(o.inv?'có hoá đơn':'KHÔNG hoá đơn')+')'));
  L.push('- Lương chủ doanh nghiệp tự trả mình: '+f(s.ownerSalary));
  L.push('- **Tổng phải gánh mỗi tháng: '+f(ohMonthly())+'** — quy ra '+f(ohPerDay())+'/ngày công ('+s.workDays+' ngày/tháng)');
  L.push('- Phân bổ vào dự án: '+(s.allocMethod==='days'?'theo số ngày công':'theo '+s.overheadPct+'% doanh thu thuần'));
  L.push('- Thuế: VAT '+s.vat+'%, TNDN '+s.cit+'%'+(s.citExempt?' (ĐANG MIỄN'+(s.citUntil?' đến '+s.citUntil:'')+')':'')+', TNCN khấu trừ freelancer '+s.pit+'% từ '+f(s.pitThreshold)+'/lần');
  L.push('- Biên gộp mục tiêu: '+s.targetGM+'%');
  L.push('');
  L.push('## Từng dự án');
  if(!S.projects.length)L.push('(Chưa có dự án nào)');
  S.projects.forEach(p=>{
    const c=calc(p);
    L.push('');
    L.push('### '+(p.name||'(chưa đặt tên)')+(p.client?' — khách: '+p.client:''));
    L.push('- Trạng thái: '+(st[p.status]||p.status)+' | Ngày công: '+n(p.days)+(p.date?' | Ngày nghiệm thu: '+p.date:''));
    L.push('- Hợp đồng: '+f(c.gross)+(p.vatIncluded?' (đã gồm VAT)':' (chưa gồm VAT)')+' → Doanh thu thuần: '+f(c.netRev)+' | VAT đầu ra: '+f(c.vatOut));
    L.push('- Chi phí trực tiếp: dự trù '+f(c.planned)+' / thực chi '+f(c.dGross)+(c.overrun?' (lệch '+pct(c.overrun)+')':''));
    (p.costs||[]).forEach(x=>{
      const act=(x.actual===''||x.actual==null)?n(x.planned):n(x.actual);
      L.push('  - '+(x.name||'(chưa ghi tên)')+' ['+x.cat+']: dự trù '+f(x.planned)+', thực chi '+f(act)+', '+(x.inv?'có hoá đơn':'KHÔNG hoá đơn'));
    });
    L.push('- Lợi nhuận gộp: '+f(c.gp)+' (biên gộp '+pct(c.gm)+') | Chi phí cố định phân bổ: '+f(c.oh));
    L.push('- Lợi nhuận trước thuế: '+f(c.ebt)+' | Thuế TNDN: '+(c.citFree?'0 (đang miễn)':f(c.citAmt))+' | **Lợi nhuận ròng: '+f(c.net)+'** (biên ròng '+pct(c.nm)+', ROI '+pct(c.roi)+')');
    L.push('- TNCN phải khấu trừ nộp thay: '+f(c.pitHold)+' | VAT phải nộp (sau khấu trừ đầu vào): '+f(c.vatPay));
    const pays=(p.payments||[]);
    if(pays.length){
      L.push('- Lịch thanh toán:');
      pays.forEach(y=>{
        const od=!y.got&&y.date&&y.date<today;
        L.push('  - '+(y.label||'Đợt')+': '+f(y.amount)+(y.date?' — hẹn '+y.date:' — CHƯA HẸN NGÀY')+' — '+(y.got?'ĐÃ VỀ':(od?'QUÁ HẠN':'chưa về')));
      });
    }
    L.push('- Đã thu: '+f(c.collected)+' | Còn phải thu: '+f(c.receivable)+' | Tiền phải giữ lại (VAT+TNDN): '+f(c.locked)+' | Tiền mặt thực còn: '+f(c.cash));
  });
  const pc=prodCalc();
  if(pc.P.tools.length||pc.P.revenue.length){
    L.push('');
    L.push('## Kênh sản phẩm — Deeplab Assist (plugin bán tự động)');
    L.push('Mô hình: build tool một lần bằng ngày công, bán license '+f(pc.P.licensePrice)+' (gồm VAT) mở khóa cả bộ — doanh thu cộng dồn cả kênh, không chia theo tool.');
    pc.P.tools.forEach(t=>L.push('- Tool '+(t.name||'(chưa tên)')+': '+n(t.days)+' ngày build → vốn '+f(toolCost(t))));
    L.push('- Tổng vốn build: '+f(pc.invest)+' | Hạ tầng: '+f(pc.P.infraMonthly)+'/tháng × '+pc.months+' tháng = '+f(pc.infra));
    L.push('- Doanh thu thuần lũy kế: '+f(pc.revNet)+(pc.orders?' ('+pc.orders+' đơn)':''));
    L.push('- **Lời/lỗ lũy kế kênh: '+f(pc.pl)+'**'+(pc.pl<0?' — cần thêm ≈ '+pc.needLic+' license để hoà vốn':' — ĐÃ HOÀN VỐN'));
    pc.P.revenue.filter(r=>r.month).sort((a,b)=>a.month<b.month?-1:1).forEach(r=>L.push('  - '+r.month+': thu '+f(r.amount)+(r.mkt?', chi MKT '+f(r.mkt):'')+(r.orders?' ('+r.orders+' đơn)':'')));
    if(pc.mkt)L.push('- Tổng chi marketing: '+f(pc.mkt)+' → ROI marketing ×'+(pc.revNet/pc.mkt).toFixed(1));
    const g=pc.P.goal;
    if(g&&n(g.target))L.push('- Mục tiêu kênh: '+f(g.target)+'/tháng — cần '+Math.ceil(n(g.target)/n(pc.P.licensePrice))+' đơn/tháng (conversion hiện tại: leads→trial '+g.leadTrial+'%, trial→mua '+g.trialBuy+'%, leads thực tế '+g.leadsNow+'/tháng)');
  }
  const list=actives().map(p=>calc(p));
  const t=list.reduce((a,c)=>({rev:a.rev+c.netRev,gp:a.gp+c.gp,net:a.net+c.net,locked:a.locked+c.locked,recv:a.recv+c.receivable,cash:a.cash+c.cash}),{rev:0,gp:0,net:0,locked:0,recv:0,cash:0});
  const gm=t.rev>0?t.gp/t.rev:0;
  L.push('');
  L.push('## Tổng hợp (không tính báo giá)');
  L.push('- Doanh thu thuần: '+f(t.rev)+' | Lợi nhuận gộp: '+f(t.gp)+' (biên '+pct(gm)+') | Lợi nhuận ròng: '+f(t.net));
  L.push('- Còn phải thu: '+f(t.recv)+' | Tiền phải giữ lại nộp thuế: '+f(t.locked)+' | Tiền mặt thực: '+f(t.cash));
  L.push('- Doanh thu hoà vốn cần mỗi tháng (theo biên gộp hiện tại): '+(gm>0?f(ohMonthly()/gm):'không tính được — chưa có biên gộp'));
  return L.join('\n');
}
async function aiCopy(){

const secState={};
function sec(id,title,body,defOpen,hint){
  const open=secState[id]===undefined?!!defOpen:secState[id];
  return `<details class="sec" data-sec="${id}"${open?' open':''}><summary>${title}${hint?`<span class="sec-hint">${hint}</span>`:''}</summary><div class="sec-body">${body}</div></details>`;
}

function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const m=document.getElementById('main');
  m.innerHTML = tab==='dash'?viewDash() : tab==='projects'?(openId?viewProject():viewList()) :
                tab==='product'?viewProduct() :
                tab==='jars'?viewJars() : tab==='quote'?viewQuote() :
                tab==='settings'?viewSettings() : viewDict();
  m.scrollTop=0;
}

function cashflowInner(){
  const today=new Date().toISOString().slice(0,10);
  const due=[];
  S.projects.forEach(p=>{ if(p.status==='quote')return;
    (p.payments||[]).forEach(y=>{ if(!y.got&&n(y.amount)>0)
      due.push({p:p.name||'Chưa đặt tên',l:y.label,a:n(y.amount),d:y.date||'',late:y.date&&y.date<today}) })});
  due.sort((a,b)=>(a.d||'9999')<(b.d||'9999')?-1:1);
  const late=due.filter(x=>x.late).reduce((a,b)=>a+b.a,0);
  const in30=due.filter(x=>!x.late&&x.d&&x.d<=new Date(Date.now()+30*864e5).toISOString().slice(0,10)).reduce((a,b)=>a+b.a,0);
  const nodate=due.filter(x=>!x.d).reduce((a,b)=>a+b.a,0);
  return `<div class="stats" style="margin-bottom:14px">
      <div class="stat"><div class="stat-l">Quá hạn chưa thu</div><div class="stat-v ${late>0?'neg':'pos'}">${fs(late)}</div></div>
      <div class="stat"><div class="stat-l">Về trong 30 ngày</div><div class="stat-v pos">${fs(in30)}</div></div>
      <div class="stat"><div class="stat-l">Chưa hẹn ngày</div><div class="stat-v ${nodate>0?'hold':''}">${fs(nodate)}</div></div>
    </div>
    ${due.length?`<div style="overflow-x:auto"><table><thead><tr><th>Dự án</th><th>Đợt</th><th>Ngày hẹn</th><th class="r">Số tiền</th></tr></thead><tbody>
    ${due.slice(0,12).map(x=>{
      const days=x.d?Math.round((new Date(x.d)-new Date(today))/864e5):null;
      const tone=x.late?'red':(days!==null&&days<=7?'amber':(x.d?'teal':'dim'));
      const when=x.late?'quá hạn '+Math.abs(days)+'d':(days===null?'chưa hẹn':(days===0?'hôm nay':days+' ngày nữa'));
      return `<tr class="due-row"><td><span class="due-dot" style="background:var(--${tone==='dim'?'dim':tone})"></span>${esc(x.p)}</td><td style="color:var(--muted)">${esc(x.l)}</td>
      <td class="mono" style="font-size:12px;color:var(--${tone==='dim'?'dim':tone})">${when}</td>
      <td class="r mono">${f(x.a)}</td></tr>`}).join('')}</tbody></table></div>`
    :'<p style="color:var(--muted);font-size:13px">Chưa có đợt thanh toán nào đang chờ. Vào từng dự án, thêm lịch thanh toán 50/50 để theo dõi dòng tiền.</p>'}
    <div class="m-hide" style="margin-top:12px;font-size:12px;color:var(--dim)">So sánh nhanh: chi phí cố định mỗi tháng của anh là <b class="mono" style="color:var(--muted)">${f(ohMonthly())} ₫</b>.</div>`;
}

function kpi(label,tone,val,sub,tip){
  return `<div class="kpi ${tone}">
    <div class="kpi-label">${label} ${tip?`<span class="hint" data-tip="${esc(tip)}">i</span>`:''}</div>
    <div class="kpi-val ${tone==='teal'?(String(val).startsWith('-')?'neg':'pos'):tone==='amber'?'hold':''}">${val}</div>
    <div class="kpi-sub">${sub}</div></div>`;
}

function alerts(list,t,gm){
  const A=[];
  // gộp cảnh báo cùng loại của nhiều dự án thành một dòng
  const loss=[],lowgm=[],overr=[],noinv=[];
  list.forEach(({p,c})=>{
    if(c.net<0)loss.push({n:p.name||'Chưa đặt tên',v:-c.net});
    else if(c.gm*100<n(S.settings.targetGM))lowgm.push({n:p.name||'Chưa đặt tên',v:c.gm});
    if(c.overrun>0.15)overr.push({n:p.name||'Chưa đặt tên',v:c.overrun,g:c.dGross,pl:c.planned});
    if(c.noInvRatio>0.4&&c.dGross>0)noinv.push({n:p.name||'Chưa đặt tên',v:c.noInvRatio});
  });
  const names=a=>a.map(x=>'"'+esc(x.n)+'"').join(', ');
  if(loss.length===1)A.push(['red','×','Dự án '+names(loss)+' đang lỗ '+f(loss[0].v)+' ₫','Sau khi gánh chi phí cố định và thuế, dự án này ăn vào tiền của công ty.']);
  else if(loss.length>1)A.push(['red','×',loss.length+' dự án đang lỗ — tổng '+f(loss.reduce((s,x)=>s+x.v,0))+' ₫',names(loss)+'. Sau khi gánh chi phí cố định và thuế, các dự án này ăn vào tiền công ty.']);
  if(overr.length===1)A.push(['red','×',names(overr)+' vượt ngân sách '+pc(overr[0].v),'Chi thực tế '+fs(overr[0].g)+' so với dự trù '+fs(overr[0].pl)+'. Đây là chỗ lợi nhuận bốc hơi.']);
  else if(overr.length>1)A.push(['red','×',overr.length+' dự án vượt ngân sách trên 15%',names(overr)+'. Đây là chỗ lợi nhuận bốc hơi.']);
  if(t.locked>0)A.push(['amber','!','Bạn đang giữ hộ nhà nước '+f(t.locked)+' ₫',
    'Gồm VAT phải nộp và thuế TNDN. Hãy tách khoản này sang một tài khoản riêng ngay khi tiền về — đây là nguyên nhân số một khiến "tính thì lãi mà cuối kỳ hết tiền".']);
  if(t.pit>0)A.push(['amber','!','Thuế TNCN khấu trừ freelancer ước tính '+f(t.pit)+' ₫',
    'Áp dụng cho khoản chi từ '+f(S.settings.pitThreshold)+' ₫/lần trở lên cho cá nhân không ký hợp đồng lao động. Nếu bạn trả đủ 100% cho họ, phần này bạn phải móc túi bù.']);
  if(noinv.length===1)A.push(['amber','!',names(noinv)+': '+pc(noinv[0].v)+' chi phí không có hoá đơn','Phần này không được trừ khi tính thuế TNDN, nên bạn nộp thuế trên khoản tiền đã tiêu mất. Việc cần làm: hợp đồng dịch vụ + chứng từ khấu trừ TNCN cho freelancer.']);
  else if(noinv.length>1)A.push(['amber','!','Chi phí không hoá đơn ở '+noinv.length+' dự án',names(noinv)+' — phần này không được trừ khi tính thuế TNDN. Việc cần làm: hợp đồng dịch vụ + chứng từ khấu trừ TNCN cho freelancer.']);
  if(lowgm.length===1)A.push(['amber','!',names(lowgm)+' có biên gộp '+pc(lowgm[0].v)+', dưới mục tiêu '+S.settings.targetGM+'%','Giá bán quá thấp hoặc chi phí sản xuất vượt dự kiến.']);
  else if(lowgm.length>1)A.push(['amber','!',lowgm.length+' dự án dưới biên gộp mục tiêu '+S.settings.targetGM+'%',names(lowgm)+'. Giá bán quá thấp hoặc chi phí sản xuất vượt dự kiến.']);
  if(t.recv>t.rev*0.4&&t.rev>0)A.push(['amber','!','Công nợ chiếm '+pc(t.recv/t.rev)+' doanh thu','Lợi nhuận đang nằm ở chỗ khách hàng chứ không phải trong tài khoản.']);
  if(S.settings.citExempt)A.push(['teal','✓','Đang trong thời gian miễn thuế TNDN'+(S.settings.citUntil?' đến hết '+S.settings.citUntil:''),
    'Ba năm này là cơ hội tích quỹ. Hết hạn, mức 20% quay lại — hãy vẫn trích đều vào hũ Dự trữ như thể đang phải nộp.']);
  if(!A.length)A.push(['teal','✓','Chưa phát hiện rủi ro tài chính nào','Các dự án đều đạt biên mục tiêu và không có khoản giữ hộ tồn đọng.']);
  const box=([k,i,ti,d])=>`<div class="alert alert-${k}"><div class="alert-icon" style="color:var(--${k==='red'?'red':k==='amber'?'amber':'teal'})">${i}</div>
     <div><b>${ti}</b><p>${d}</p></div></div>`;
  const shown=A.slice(0,2), more=A.slice(2);
  return `<div style="margin-bottom:2px">${shown.map(box).join('')}
    ${more.length?`<details class="alert-more"><summary>Xem thêm ${more.length} cảnh báo</summary>${more.map(box).join('')}</details>`:''}</div>`;
}

    <th>Dự án</th><th>Khách hàng</th><th>Trạng thái</th>
    <th class="r">Doanh thu thuần</th><th class="r">Biên gộp</th><th class="r">Lợi nhuận ròng</th><th class="r">Cần giữ lại</th></tr></thead><tbody>
    ${ps.map(p=>{const c=calc(p);return `<tr class="clickable" onclick="openP('${p.id}')">
      <td><b>${esc(p.name||'Chưa đặt tên')}</b></td>
      <td style="color:var(--muted)">${esc(p.client||'—')}</td>

}

/* ---------- BẢNG KẾT QUẢ (cột phải) ---------- */
function sideP(p){
  const c=calc(p);
  const segs=[
    ['VAT thu hộ',c.vatOut,'var(--amber)'],
    ['Chi phí trực tiếp',c.dNet,'var(--clay)'],
    ['Chi phí cố định',Math.max(0,c.oh),'var(--plum)'],
    ['Thuế TNDN',c.citAmt,'#C2843C'],
    ['Lợi nhuận ròng',Math.max(0,c.net),'var(--teal)']
  ];
  const tot=segs.reduce((a,b)=>a+b[1],0)||1;
  return `
  <div class="card" style="margin-bottom:12px">
    <div class="card-title">Tiền đi đâu</div>
    <div class="wf">${segs.map(([nm,v,col])=>{
      const w=v/tot*100;return `<div class="wf-seg" style="width:${w}%;background:${col}" title="${nm}: ${f(v)} ₫">${w>11?pc(v/tot):''}</div>`}).join('')}
    </div>
    <div class="wf-legend">${segs.map(([nm,v,col])=>
      `<div class="wf-item" style="width:100%"><span class="wf-key" style="background:${col}"></span>${nm}<span class="wf-amt">${f(v)} ₫</span></div>`).join('')}</div>
    ${c.net<0?`<div class="alert alert-red" style="margin-top:12px"><div class="alert-icon" style="color:var(--red)">×</div><div><b>Dự án lỗ ${f(-c.net)} ₫</b><p>Doanh thu không đủ gánh chi phí cố định.</p></div></div>`:''}
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="card-title">Bảng lãi lỗ</div>
    <div class="ladder">
      ${lad('Giá trị hợp đồng (gồm VAT)',c.billed,'','Số tiền khách chuyển khoản.')}
      ${lad('− VAT đầu ra ('+S.settings.vat+'%)',-c.vatOut,'hold','Bạn chỉ thu hộ nhà nước. Không phải doanh thu.')}
      ${lad('Doanh thu thuần',c.netRev,'','Net Revenue — doanh thu thật sự ghi nhận.')}
      ${lad('− Chi phí trực tiếp',-c.dNet,'','COGS — chi phí chỉ phát sinh vì có dự án này: freelancer, thuê thiết bị, bối cảnh, đi lại.')}
      ${lad('Lợi nhuận gộp',c.gp,c.gp>=0?'pos':'neg','Gross Profit. Biên gộp '+pc(c.gm)+'.')}
      ${lad('− Chi phí cố định phân bổ',-c.oh,'','Overhead Allocation — phần văn phòng, điện nước, phần mềm, lương bạn mà dự án này phải gánh ('+n(p.days)+' ngày × '+f(ohPerDay())+' ₫).')}
      ${lad('Lợi nhuận trước thuế',c.ebt,c.ebt>=0?'pos':'neg','EBT — Earnings Before Tax.')}
      ${c.citFree
        ? lad('− Thuế TNDN (đang được miễn)',0,'pos','Doanh nghiệp nhỏ và vừa được miễn thuế TNDN 3 năm kể từ ngày cấp GCN đăng ký doanh nghiệp lần đầu (Nghị quyết 198/2025/QH15). Nếu không được miễn, khoản này sẽ là '+f(Math.max(0,c.taxable*n(S.settings.cit)/100))+' ₫.')
        : lad('− Thuế TNDN ('+S.settings.cit+'%)',-c.citAmt,'hold','Tính trên lợi nhuận chịu thuế '+f(c.taxable)+' ₫ — chỉ chi phí có chứng từ hợp lệ mới được trừ.')}
      <div class="ladder-row total"><span class="ladder-name">Lợi nhuận ròng</span><span class="ladder-val ${c.net>=0?'pos':'neg'}">${f(c.net)} ₫</span></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="card-title">Chỉ số</div>
    <div class="grid g2" style="gap:10px">
      ${mini('Biên gộp',pc(c.gm),c.gm*100>=n(S.settings.targetGM)?'pos':'neg','Gross Margin — chuẩn ngành sản xuất TVC 35–55%.')}
      ${mini('Biên ròng',pc(c.nm),c.nm>=0?'pos':'neg','Net Margin — mục tiêu lành mạnh 15–25%.')}
      ${mini('ROI',pc(c.roi),c.roi>=0?'pos':'neg','Return on Investment = Lợi nhuận ròng / Tổng vốn bỏ ra. Cho biết mỗi đồng bỏ ra thu về bao nhiêu.')}
      ${mini('Markup',pc(c.markup),'','Tỷ lệ đội giá trên chi phí. Markup 100% mới bằng biên gộp 50% — đây là chỗ hay tính nhầm.')}
      ${mini('Vượt ngân sách',c.planned?pc(c.overrun):'—',c.overrun>0?'neg':'pos','Chênh lệch giữa chi thực tế và dự trù ban đầu. Trên 10% là báo động.')}
      ${mini('Chi không hoá đơn',pc(c.noInvRatio),c.noInvRatio>0.4?'neg':'','Tỷ lệ chi phí không có chứng từ. Càng cao thì thuế TNDN càng nặng.')}
    </div>
  </div>

  <div class="card">
    <div class="card-title">Dòng tiền</div>
    <div class="ladder">
      ${lad('Khách đã thanh toán',c.collected,'pos')}
      ${lad('Còn phải thu',c.receivable,c.receivable>0?'hold':'','Accounts Receivable — tiền chưa về tài khoản.')}
      ${lad('Đã chi cho sản xuất',-c.dGross,'')}
      ${lad('VAT phải nộp',-Math.max(0,c.vatPay),'hold','VAT đầu ra trừ VAT đầu vào được khấu trừ.')}
      ${lad('Thuế TNDN để dành',-c.citAmt,'hold')}
      ${lad('TNCN khấu trừ freelancer',-c.pitHold,'hold','Ước tính '+S.settings.pit+'% trên mọi khoản chi không hoá đơn đạt từ '+f(S.settings.pitThreshold)+' ₫/lần. Nếu khoản đó trả cho cá nhân thì bạn phải khấu trừ và nộp thay họ.')}
      <div class="ladder-row total"><span class="ladder-name">Tiền được phép tiêu</span><span class="ladder-val ${c.cash>=0?'pos':'neg'}">${f(c.cash)} ₫</span></div>
    </div>
  </div>`;
}
function lad(name,v,cls,tip){
  return `<div class="ladder-row"><span class="ladder-name">${name}${tip?` <span class="hint" data-tip="${esc(tip)}">i</span>`:''}</span>
  <span class="ladder-val ${cls||''}">${f(v)} ₫</span></div>`;
}
function mini(l,v,cls,tip){
  return `<div style="background:var(--void);border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px">
    <div style="font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px">${l} ${tip?`<span class="hint" data-tip="${esc(tip)}">i</span>`:''}</div>
    <div class="mono ${cls||''}" style="font-size:16px;font-weight:700;margin-top:3px">${v}</div></div>`;
}


/* ---------- CHIA HŨ TIỀN ---------- */
function viewJars(){
  const st=S.settings, amt=n(jar.amount);
  const p=S.projects.find(x=>x.id===jar.project);
  const suggestOps=n(st.avgRevenue)>0? ohMonthly()/n(st.avgRevenue)*100 : 0;
  let rows=[], warn='';

  if(p){
    const c=calc(p), B=c.billed||1, r=amt/B;
    const tax=(Math.max(0,c.vatPay)+c.citAmt+c.pitHold)*r;
    const prod=c.dGross*r, ops=Math.max(0,c.oh)*r;
    let left=amt-tax-prod-ops;
    const res=Math.max(0,Math.min(left,amt*n(st.reservePct)/100));
    const own=left-res;
    rows=[
      ['Hũ Thuế','var(--amber)',tax,'VAT + TNDN + TNCN khấu trừ của riêng dự án này. Chuyển sang tài khoản thuế ngay hôm tiền về.'],
      ['Hũ Sản xuất','var(--clay)',prod,'Tiền trả freelancer, thuê thiết bị, bối cảnh. Đã có chủ, đừng coi là tiền mình.'],
      ['Hũ Vận hành','var(--plum)',ops,'Phần dự án này gánh cho văn phòng, kế toán, phần mềm, khấu hao máy.'],
      ['Hũ Dự trữ','#5FA8D3',res,'Quỹ khẩn cấp. Chỉ đụng khi mất job hoặc hỏng thiết bị.'],
      ['Hũ Của anh','var(--teal)',own,'Lương và lợi nhuận. Đây mới là tiền tiêu được.']
    ];
    if(own<0) warn='Dự án này không đủ tiền chia. Sau khi để dành thuế, trả sản xuất và gánh vận hành, còn thiếu '+f(-own)+' ₫. Nghĩa là anh đang bù lỗ bằng tiền dự án khác.';
  } else {
    const t=amt*n(st.jarTax)/100, o=amt*n(st.jarOps)/100, r2=amt*n(st.jarReserve)/100;
    rows=[
      ['Hũ Thuế','var(--amber)',t,'VAT '+st.vat+'% cộng phần dự phòng thuế TNDN.'],
      ['Hũ Vận hành','var(--plum)',o,'Nuôi bộ máy: văn phòng, kế toán, phần mềm, khấu hao.'],
      ['Hũ Dự trữ','#5FA8D3',r2,'Quỹ khẩn cấp.'],
      ['Hũ Sản xuất + Của anh','var(--teal)',amt-t-o-r2,'Phần còn lại để trả ê-kíp và trả lương chính mình.']
    ];
  }

  const target=ohMonthly()*n(st.reserveMonths);
  const have=n(st.reserveBalance);
  const pctR=target>0? Math.min(100,have/target*100) : 0;

  return `<div class="page-head"><div class="page-title">Chia hũ tiền</div>
  <div class="page-desc">Mỗi lần khách chuyển khoản, chia ngay trước khi tiêu bất cứ đồng nào. Tiền không chia là tiền sẽ bị tiêu nhầm.</div></div>

  <div class="split">
    <div class="stack">

      <label class="f"><div class="f-label">Số ngày công dồn cho dự án</div>
        <input type="number" min="0" step="0.5" data-q="days" value="${quote.days}"></label>
      <label class="f"><div class="f-label">Biên lợi nhuận gộp mong muốn: <b class="mono" id="qgm" style="color:var(--teal)">${quote.gm}%</b></div>
        <input type="range" min="10" max="75" step="1" data-q="gm" value="${quote.gm}" style="width:100%;padding:0;background:none;border:none">
        <div style="font-size:11px;color:var(--dim);margin-top:4px">Sản xuất TVC ở Việt Nam thường 35–55%. Dưới 30% gần như không đủ nuôi bộ máy.</div></label>
    </div>

  </div>`;
}
function quoteOut(){
  const gmT=n(quote.gm)/100;
  const oh=ohPerDay()*n(quote.days);
  const cost=n(quote.cost);
  const revFloor=cost+oh;                        // hoà vốn: đủ trả chi phí trực tiếp + bộ máy
  const revForGM=gmT<1? cost/(1-gmT) : 0;        // giá đạt biên gộp mong muốn
  const withVat=revForGM*(1+n(S.settings.vat)/100);
  const ebt=revForGM-cost-oh;
  const netProfit=ebt>0? ebt*(1-n(S.settings.cit)/100) : ebt;
  const belowFloor=revForGM<revFloor;
  return `<div class="kpi teal">
        <div class="kpi-label">Giá chào chưa VAT</div>
        <div class="kpi-val pos">${f(revForGM)} ₫</div>
        <div class="kpi-sub">Ghi trên hợp đồng: <b class="mono">${f(withVat)} ₫</b> (đã gồm VAT ${S.settings.vat}%)</div>
      </div>
      <div class="card">
        <div class="ladder">
          ${lad('Giá sàn tuyệt đối (hoà vốn)',revFloor,'hold','Dưới mức này bạn làm không công và vẫn lỗ chi phí cố định.')}
          ${lad('Chi phí cố định dự án gánh',oh,'','Đã gồm phần lương của chính bạn.')}
          ${lad('Lợi nhuận trước thuế',ebt,ebt>=0?'pos':'neg')}
          ${lad('Thuế TNDN ước tính',ebt>0?-ebt*n(S.settings.cit)/100:0,'hold')}
          <div class="ladder-row total"><span class="ladder-name">Còn thật trong túi</span><span class="ladder-val ${netProfit>=0?'pos':'neg'}">${f(netProfit)} ₫</span></div>
        </div>
      </div>
      ${belowFloor?`<div class="alert alert-red"><div class="alert-icon" style="color:var(--red)">×</div>
      <div><b>Giá này chưa gánh nổi bộ máy</b><p>Với ${quote.days} ngày công, giá tối thiểu phải là ${f(revFloor)} ₫ chưa VAT. Hãy nâng biên gộp mục tiêu hoặc rút ngắn số ngày.</p></div></div>`:
      `<div class="alert alert-teal"><div class="alert-icon" style="color:var(--teal)">✓</div>
      <div><b>Quy tắc nhanh khi khách ép giá</b><p>Giảm 10% giá bán ở biên gộp 40% sẽ ăn mất 25% lợi nhuận gộp. Thà tăng khối lượng công việc còn hơn hạ đơn giá.</p></div></div>`}`;
}
function qmoney(label,k,v,tip){return `<label class="f"><div class="f-label">${label} ${tip?`<span class="hint" data-tip="${esc(tip)}">i</span>`:''}</div><input class="money" type="text" data-q="${k}" value="${v?f(v):''}" placeholder="0"></label>`}

/* ---------- KÊNH SẢN PHẨM (Deeplab Assist) ---------- */
function prodCalc(){
  const P=S.product||normProduct(null), rate=ohPerDay(), v=n(S.settings.vat)/100;
  const invest=P.tools.reduce((a,t)=>a+n(t.days)*rate+n(t.extra),0);
  const months=P.revenue.length;
  const infra=months*n(P.infraMonthly);
  const revGross=P.revenue.reduce((a,r)=>a+n(r.amount),0);
  const revNet=revGross/(1+v);
  const orders=P.revenue.reduce((a,r)=>a+n(r.orders),0);
  const mkt=P.revenue.reduce((a,r)=>a+n(r.mkt),0);
  const cost=invest+infra+mkt;
  const pl=revNet-cost;
  const licNet=n(P.licensePrice)/(1+v);
  const needLic=pl<0&&licNet>0?Math.ceil(-pl/licNet):0;
  const sorted=[...P.revenue].filter(r=>r.month).sort((a,b)=>a.month<b.month?-1:1);
  const last=sorted[sorted.length-1]||null, prev=sorted[sorted.length-2]||null;
  const n3=Math.min(3,sorted.length);
  const avg3=n3?sorted.slice(-n3).reduce((a,r)=>a+n(r.amount),0)/n3:0;
  return {P,rate,invest,infra,months,revGross,revNet,orders,mkt,cost,pl,licNet,needLic,last,prev,avg3};
}
function toolCost(t){return n(t.days)*ohPerDay()+n(t.extra)}
function monthLabel(m){if(!m)return '(chưa chọn tháng)';const[y,mo]=m.split('-');return 'Tháng '+n(mo)+'/'+y}
function prodKpis(){
  const c=prodCalc();
  return `
    <div class="kpi teal"><div class="kpi-label">Doanh thu thuần lũy kế <span class="hint" data-tip="Tổng tiền khách đã trả (đã bóc VAT ${S.settings.vat}%). Doanh thu kênh này cộng dồn cả bộ plugin — không chia theo từng tool vì một license mở khóa tất cả.">i</span></div>
      <div class="kpi-val">${f(c.revNet)} ₫</div><div class="kpi-sub">${c.orders?c.orders+' đơn · ':''}${f(c.revGross)} ₫ gồm VAT</div></div>
    <div class="kpi amber"><div class="kpi-label">Tổng vốn đã bỏ <span class="hint" data-tip="Công build các tool (ngày công × ${f(ohPerDay())} ₫) + hạ tầng ${f(c.P.infraMonthly)} ₫ × ${c.months} tháng vận hành.">i</span></div>
      <div class="kpi-val">${f(c.cost)} ₫</div><div class="kpi-sub">Build ${f(c.invest)} + hạ tầng ${f(c.infra)}${c.mkt?' + MKT '+f(c.mkt):''}</div></div>
    <div class="kpi ${c.pl>=0?'teal':'red'}"><div class="kpi-label">Lời / lỗ lũy kế kênh</div>
      <div class="kpi-val ${c.pl>=0?'pos':'neg'}">${f(c.pl)} ₫</div>
      <div class="kpi-sub">${c.pl>=0?'Kênh đã hoàn vốn':'Cần thêm ≈ '+c.needLic+' license để hoà vốn'}</div></div>
    <div class="kpi plum"><div class="kpi-label">Tháng gần nhất</div>
      <div class="kpi-val">${c.last?f(c.last.amount):0} ₫</div>
      <div class="kpi-sub">${c.prev?('Tháng trước: '+f(c.prev.amount)+' ₫'):'Chưa đủ dữ liệu so sánh'}</div></div>`;
}
function prodOut(){
  const c=prodCalc();
  const pct=c.cost>0?Math.min(100,Math.max(0,c.revNet/c.cost*100)):0;
  const trendDown=c.last&&c.prev&&n(c.last.amount)<n(c.prev.amount);
  return `
    <div class="card">
      <div class="card-title">Tiến độ hoàn vốn toàn kênh</div>
      <div style="height:8px;background:var(--void);border-radius:4px;overflow:hidden;margin-bottom:8px">

      </div>
      <div style="font-size:12px;color:var(--muted)">Đã thu hồi <b class="mono" style="color:var(--text)">${pct.toFixed(0)}%</b> của ${f(c.cost)} ₫ đã bỏ ra${c.pl<0?' — còn thiếu <b class="mono">'+f(-c.pl)+' ₫</b> ≈ <b class="mono">'+c.needLic+'</b> license '+f(c.P.licensePrice)+' ₫':''}.</div>
      <div class="ladder" style="margin-top:10px">
        <div class="ladder-row"><span class="ladder-name">Trung bình ${Math.min(3,c.months)||0} tháng gần nhất</span><span class="ladder-val">${f(c.avg3)} ₫/tháng</span></div>
        ${c.mkt?`<div class="ladder-row"><span class="ladder-name">Chi MKT lũy kế → ROI marketing <span class="hint" data-tip="ROI = doanh thu thuần / tiền marketing đã chi. Dưới 1 nghĩa là quảng cáo đang đốt tiền; theo dõi theo tháng để biết kênh nào đáng dồn vốn.">i</span></span><span class="ladder-val ${c.revNet/c.mkt>=1?'pos':'neg'}">${f(c.mkt)} ₫ · ×${(c.revNet/c.mkt).toFixed(1)}</span></div>`:''}
        <div class="ladder-row"><span class="ladder-name">Hạ tầng mỗi tháng phải nuôi</span><span class="ladder-val hold">${f(c.P.infraMonthly)} ₫</span></div>
        <div class="ladder-row total"><span class="ladder-name">Kênh tự nuôi hạ tầng chưa?</span><span class="ladder-val ${c.avg3/(1+n(S.settings.vat)/100)>=c.P.infraMonthly?'pos':'neg'}">${c.avg3/(1+n(S.settings.vat)/100)>=c.P.infraMonthly?'Rồi':'Chưa'}</span></div>
      </div>
    </div>
    ${trendDown?`<div class="alert alert-amber"><div class="alert-icon" style="color:var(--amber)">!</div>
    <div><b>Đà doanh thu đang giảm</b><p>${monthLabel(c.last.month)} thấp hơn ${monthLabel(c.prev.month)}. Xem lại dashboard admin: trial hết hạn chưa mua là danh sách nên gửi email nhắc đầu tiên.</p></div></div>`:''}
    ${c.pl>=0&&c.cost>0?`<div class="alert alert-teal"><div class="alert-icon" style="color:var(--teal)">✓</div>
    <div><b>Kênh đã hoàn vốn</b><p>Từ giờ mỗi license bán thêm gần như là lợi nhuận ròng (chỉ trừ VAT, thuế và hạ tầng). Đây là lúc đáng cân nhắc dồn thêm ngày công build tool mới.</p></div></div>`:''}`;
}

function goalOut(){
  const P=S.product, g=P.goal||{};
  const price=n(P.licensePrice)||349000;
  const orders=n(g.target)>0?Math.ceil(n(g.target)/price):0;
  const trials=n(g.trialBuy)>0?Math.ceil(orders/(n(g.trialBuy)/100)):0;
  const leads=n(g.leadTrial)>0?Math.ceil(trials/(n(g.leadTrial)/100)):0;
  const gap=n(g.leadsNow)>0&&leads?leads/n(g.leadsNow):0;
  let verdict='';
  if(orders&&gap){
    if(gap<=1.2)verdict='<b>Traffic hiện tại đã gần đủ.</b> Vấn đề nằm ở tỷ lệ chuyển đổi — dồn sức vào email nhắc trial hết hạn và trang bán.';
    else if(gap<=5)verdict='<b>Trong tầm với:</b> cần gấp '+gap.toFixed(1)+'× lượng người tiếp cận hiện tại — tăng đều đặn số bài đăng/video có gắn link UTM, kết hợp nâng nhẹ conversion.';
    else verdict='<b>Đừng cố tăng traffic '+Math.round(gap)+'× ngay.</b> Nâng tỷ lệ chuyển đổi trước (leads→trial và trial→mua đều còn thấp) — mỗi điểm % conversion tăng sẽ kéo số leads cần xuống mạnh, rồi mới tăng traffic.';
  }
  return `<div class="ladder">
    <div class="ladder-row"><span class="ladder-name">Cần bán mỗi tháng</span><span class="ladder-val">${orders} đơn</span></div>
    <div class="ladder-row"><span class="ladder-name">→ Cần số trial</span><span class="ladder-val">${trials} trial</span></div>
    <div class="ladder-row total"><span class="ladder-name">→ Cần số leads tiếp cận</span><span class="ladder-val hold">${f(leads)} leads/tháng</span></div>
    ${gap?`<div class="ladder-row"><span class="ladder-name">So với thực tế hiện nay</span><span class="ladder-val ${gap<=1.2?'pos':'neg'}">gấp ${gap.toFixed(1)} lần</span></div>`:''}
  </div>
  ${verdict?`<div style="font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5">${verdict}</div>`:''}`;
}
function prodRefresh(){
  const k=document.getElementById('pkpi');if(k)k.innerHTML=prodKpis();
  const o=document.getElementById('pout');if(o)o.innerHTML=prodOut();
  const P=S.product, licNet=n(P.licensePrice)/(1+n(S.settings.vat)/100);
  P.tools.forEach(t=>{
    const a=document.querySelector('[data-tv="'+t.id+'"]');if(a)a.textContent=f(toolCost(t));
    const b=document.querySelector('[data-tl="'+t.id+'"]');if(b)b.textContent=licNet>0?Math.ceil(toolCost(t)/licNet):0;
  });
}
function addTool(){S.product.tools.push({id:u(),name:'',days:1,extra:0});save();render()}
function delTool(id){if(!confirm('Xoá tool này khỏi danh sách đầu tư?'))return;S.product.tools=S.product.tools.filter(x=>x.id!==id);save();render()}
function addRev(){
  const now=new Date(), used=new Set(S.product.revenue.map(r=>r.month));
  let d=new Date(now.getFullYear(),now.getMonth(),1);
  for(let i=0;i<24&&used.has(d.toISOString().slice(0,7));i++)d=new Date(d.getFullYear(),d.getMonth()-1,1);
  S.product.revenue.push({id:u(),month:d.toISOString().slice(0,7),amount:0,orders:0});
  save();render();
}

/* ============ XUẤT EXCEL ============ */
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=res; sc.onerror=rej; document.head.appendChild(sc);
  });
}
function sheet(aoa,widths,pctCols){
  const P=pctCols||[];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const rg=XLSX.utils.decode_range(ws['!ref']);
  for(let R=rg.s.r;R<=rg.e.r;R++)for(let C=rg.s.c;C<=rg.e.c;C++){
    const c=ws[XLSX.utils.encode_cell({r:R,c:C})];
    if(c&&typeof c.v==='number')c.z= P.indexOf(C)>=0? '0.0%' : '#,##0';
  }
  ws['!cols']=(widths||[]).map(w=>({wch:w}));
  ws['!freeze']={xSplit:0,ySplit:1};
  return ws;
}

/* ============ NHẬP LIỆU ============ */
function digits(s){return String(s).replace(/[^\d]/g,'')}
function fmtLive(el){
  const raw=digits(el.value);
  const before=el.value.slice(0,el.selectionStart).replace(/[^\d]/g,'').length;
  el.value=raw?nf.format(parseInt(raw,10)):'';
  let seen=0,pos=el.value.length;
  for(let i=0;i<el.value.length;i++){if(/\d/.test(el.value[i]))seen++;if(seen===before){pos=i+1;break}}
  if(before===0)pos=0;
  try{el.setSelectionRange(pos,pos)}catch(e){}
  return raw===''?'':parseInt(raw,10);
}
/* Bộ gõ tiếng Việt (Unikey/EVKey): không format ô tiền khi đang trong phiên gõ dở,
   chờ compositionend rồi mới xử lý — tránh ký tự bị chèn lặp đôi */
let imeOn=false;
document.addEventListener('compositionstart',()=>{imeOn=true});
document.addEventListener('compositionend',e=>{
  imeOn=false;
  const el=e.target;
  if(el&&el.classList&&el.classList.contains('money')){
    setTimeout(()=>el.dispatchEvent(new Event('input',{bubbles:true})),0);
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  const isMoney=el.classList.contains('money');
  if(isMoney&&(e.isComposing||imeOn))return;
  let val=isMoney?fmtLive(el):(el.type==='checkbox'?el.checked:el.value);
  const p=cur();

  if(el.dataset.p&&p){
    const k=el.dataset.p;
    p[k]= k==='contract'? (val===''?0:val)
        : k==='vatIncluded'? el.value==='1'
        : k==='days'? n(el.value) : el.value;
    const echo=document.querySelector('[data-echo="'+k+'"]');
    if(echo)echo.textContent=val?fs(val)+' ₫':'';
    refresh();
  }
  else if(el.dataset.c&&p){
    const id=el.closest('[data-cid]').dataset.cid;
    const c=p.costs.find(x=>x.id===id);if(!c)return;
    const k=el.dataset.c;
    c[k]= k==='inv'? el.checked : (k==='planned'||k==='actual')? val : el.value;
    refresh();
  }
  else if(el.dataset.y&&p){
    const id=el.closest('[data-yid]').dataset.yid;
    const y=p.payments.find(x=>x.id===id);if(!y)return;
    const k=el.dataset.y;
    y[k]= k==='got'? el.checked : k==='amount'? (val===''?0:val) : el.value;
    refresh();
  }
  else if(el.dataset.o){
    const id=el.closest('[data-oid]').dataset.oid;
    const o=S.settings.overhead.find(x=>x.id===id);if(!o)return;
    const k=el.dataset.o;
    o[k]= k==='inv'? el.checked : k==='amount'? (val===''?0:val) : el.value;
    refreshOH();
  }
  else if(el.dataset.s){
    const k=el.dataset.s;
    S.settings[k]= el.type==='checkbox'? el.checked
                 : (k==='allocMethod'||k==='citUntil')? el.value
                 : (isMoney? (val===''?0:val) : n(el.value));
    refreshOH();
  }
  else if(el.dataset.j){
    const k=el.dataset.j;
    jar[k]= isMoney? (val===''?0:val) : el.value;
    if(tab==='jars'&&k==='project')render(); else if(tab==='jars')renderJarSplit();
    return save();
  }
  else if(el.dataset.q){
    const k=el.dataset.q;
    quote[k]= isMoney? (val===''?0:val) : n(el.value);
    if(tab==='quote'){
      const g=document.getElementById('qgm');if(g)g.textContent=quote.gm+'%';
      const o=document.getElementById('qout');if(o)o.innerHTML=quoteOut();
    }
    return save();
  }
  else if(el.dataset.t){
    const id=el.closest('[data-tid]').dataset.tid;
    const t=S.product.tools.find(x=>x.id===id);if(!t)return;
    const k=el.dataset.t;
    t[k]= k==='days'? n(el.value) : k==='extra'? (val===''?0:val) : el.value;
    prodRefresh();
  }
  else if(el.dataset.r){
    const id=el.closest('[data-rid]').dataset.rid;
    const r=S.product.revenue.find(x=>x.id===id);if(!r)return;
    const k=el.dataset.r;
    r[k]= (k==='amount'||k==='mkt')? (val===''?0:val) : k==='orders'? n(el.value) : el.value;
    prodRefresh();
  }
  else if(el.dataset.pg){
    const k=el.dataset.pg;
    if(!S.product.goal)S.product.goal={};
    S.product.goal[k]= isMoney? (val===''?0:val) : n(el.value);
    const o=document.getElementById('pgout');if(o)o.innerHTML=goalOut();
    return save();
  }
  else if(el.dataset.pc){
    const k=el.dataset.pc;
    S.product[k]= isMoney? (val===''?0:val) : el.value;
    prodRefresh();
  }
  save();
});
function refresh(){
  const p=cur();const side=document.getElementById('side');
  if(p&&side)side.innerHTML=sideP(p);
}
function renderJarSplit(){ const m=document.getElementById('main'); const sc=m.scrollTop;
  const a=document.activeElement, sel=a&&a.selectionStart, id=a&&a.dataset&&a.dataset.j;
  m.innerHTML=viewJars(); m.scrollTop=sc;
  if(id){const el=m.querySelector('[data-j="'+id+'"]'); if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
}
function refreshOH(){
  const a=document.getElementById('ohTotal'),b=document.getElementById('ohDay');
  if(a)a.textContent=f(ohMonthly())+' ₫';
  if(b)b.textContent=f(ohPerDay())+' ₫';
}
document.addEventListener('change',e=>{
  if(e.target.dataset.p==='status'||e.target.dataset.p==='vatIncluded'){save()}
  if(e.target.dataset.s==='allocMethod'||e.target.dataset.o!==undefined){save();if(tab==='settings')render()}
});
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.tab));

/* vuốt ngang để chuyển tab trên điện thoại */
const TABS=['dash','projects','product','jars','quote','settings','dict'];
let tx=0,ty=0,tt=0;
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!matchMedia('(max-width:1020px)').matches||!e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Date.now()-tt>600||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2)return;
  if(e.target.closest&&e.target.closest('input,select,textarea,table,.bar-track'))return;
  const i=TABS.indexOf(tab);if(i<0)return;
  const ni=dx<0?Math.min(TABS.length-1,i+1):Math.max(0,i-1);
  if(ni!==i){openId=null;go(TABS[ni])}
},{passive:true});
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('hint')){
    document.querySelectorAll('.hint.open').forEach(h=>{if(h!==e.target)h.classList.remove('open')});
    e.target.classList.toggle('open');
    return;
  }
  document.querySelectorAll('.hint.open').forEach(h=>h.classList.remove('open'));
  // mobile: chạm cảnh báo để xổ/gập phần giải thích
  const al=e.target.closest&&e.target.closest('.alert');
  if(al&&matchMedia('(max-width:1020px)').matches)al.classList.toggle('open');
});
